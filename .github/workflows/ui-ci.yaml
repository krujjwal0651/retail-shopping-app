name: UI CI

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - "ui/**"
            - ".github/workflows/ui-ci.yaml"
    push:
        branches: [main]
        paths:
            - "ui/**"
            - ".github/workflows/ui-ci.yaml"

permissions:
    contents: read

concurrency:
    group: ui-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test and package UI
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        defaults:
            run:
                working-directory: ui

        steps:
            - name: Check out source
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Java 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
                  cache-dependency-path: ui/pom.xml

            - name: Build and test
              run: ./mvnw --batch-mode --no-transfer-progress verify

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver: docker-container

            - name: Build container image
              uses: docker/build-push-action@v7
              with:
                  context: ./ui
                  tags: ui:ci
                  load: true
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Scan UI image for vulnerabilities
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ui:ci
                  format: table
                  exit-code: "0"
                  severity: HIGH,CRITICAL
                  vuln-type: os,library
                  ignore-unfixed: false

            - name: Start UI container
              run: |
                  docker run --detach --rm \
                    --name ui-ci \
                    --publish 8080:8080 \
                    ui:ci

            - name: Check UI container health
              run: |
                  for attempt in {1..30}; do
                    if curl --fail --silent --show-error \
                      http://localhost:8080/actuator/health; then
                      exit 0
                    fi
                    sleep 2
                  done

                  echo "::error::UI container did not become healthy within 60 seconds."
                  exit 1

            - name: Show container logs on failure
              if: failure()
              run: docker logs ui-ci || true

            - name: Stop UI container
              if: always()
              run: docker stop ui-ci || true

    verify-aws-oidc:
        name: Verify AWS OIDC access
        needs: test
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        permissions:
            id-token: write

        steps:
            - name: Configure temporary AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.3.1
              with:
                  aws-region: us-east-1
                  role-to-assume: arn:aws:iam::883017228092:role/retail-shopping-app-ui-ecr-push-main
                  role-session-name: ui-ci-${{ github.run_id }}
                  role-duration-seconds: 900
                  allowed-account-ids: 883017228092

            - name: Display OIDC claims
              shell: bash
              run: |
                  response="$(curl --fail --silent --show-error \
                    --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

                  token="$(printf '%s' "$response" | jq --raw-output '.value')"
                  payload="$(printf '%s' "$token" | cut --delimiter='.' --fields=2)"
                  payload="${payload//-/+}"
                  payload="${payload//_/\/}"

                  case $((${#payload} % 4)) in
                    2) payload="${payload}==" ;;
                    3) payload="${payload}=" ;;
                  esac

                  printf '%s' "$payload" | base64 --decode | jq \
                    '{aud, sub, repository, ref, event_name, environment}'

            - name: Confirm assumed AWS identity
              run: aws sts get-caller-identity
