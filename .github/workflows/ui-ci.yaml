name: CI workflow for UI

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - "ui/**"
            - ".github/workflows/ui-ci.yaml"
    push:
        branches: [main]
        paths:
            - "ui/**"
            - ".github/workflows/ui-ci.yaml"

permissions:
    contents: read

concurrency:
    group: ui-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test and package UI
        environment: AWS
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        permissions:
            contents: read
            id-token: write

        defaults:
            run:
                working-directory: ui

        steps:
            - name: Check out source
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Java 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
                  cache-dependency-path: ui/pom.xml

            - name: Build and test
              run: ./mvnw --batch-mode --no-transfer-progress verify

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver: docker-container

            - name: Build container image
              uses: docker/build-push-action@v7
              with:
                  context: ./ui
                  tags: ui:ci
                  load: true
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Scan UI image for vulnerabilities
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ui:ci
                  format: table
                  exit-code: "0"
                  severity: HIGH,CRITICAL
                  vuln-type: os,library
                  ignore-unfixed: false

            - name: Generate UI SBOM
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ui:ci
                  format: cyclonedx
                  output: ui-sbom.cdx.json
                  exit-code: "0"
                  skip-setup-trivy: true

            - name: Upload UI SBOM
              uses: actions/upload-artifact@v4
              with:
                  name: ui-sbom-${{ github.sha }}
                  path: ui-sbom.cdx.json
                  if-no-files-found: error
                  retention-days: 90

            - name: Start UI container
              run: |
                  docker run --detach --rm \
                    --name ui-ci \
                    --publish 8080:8080 \
                    ui:ci

            - name: Check UI container health
              run: |
                  for attempt in {1..30}; do
                    if curl --fail --silent --show-error \
                      http://localhost:8080/actuator/health; then
                      exit 0
                    fi
                    sleep 2
                  done

                  echo "::error::UI container did not become healthy within 60 seconds."
                  exit 1

            - name: Show container logs on failure
              if: failure()
              run: docker logs ui-ci || true

            - name: Stop UI container
              if: always()
              run: docker stop ui-ci || true

            - name: Configure temporary AWS credentials
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: aws-actions/configure-aws-credentials@v6.3.1
              with:
                  aws-region: ${{ vars.AWS_REGION }}
                  role-to-assume: ${{ vars.AWS_ROLE_RETAIL_APP_ECR_PUSH_ARN }}
                  role-session-name: ui-ci-${{ github.run_id }}
                  role-duration-seconds: 900
                  allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

            - name: Log in to Amazon ECR
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Check whether image tag already exists
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              id: image-exists
              env:
                  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
                  IMAGE_TAG: sha-${{ github.sha }}
              run: |
                  if aws ecr describe-images \
                    --repository-name "${ECR_REPOSITORY}" \
                    --image-ids imageTag="${IMAGE_TAG}" \
                    --query 'imageDetails[0].imageDigest' \
                    --output text >/dev/null 2>&1; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Tag and push image to ECR
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image-exists.outputs.exists != 'true'
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
                  IMAGE_TAG: sha-${{ github.sha }}
              run: |
                  IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
                  docker tag ui:ci "${IMAGE_URI}"
                  docker push "${IMAGE_URI}"
                  echo "Pushed ${IMAGE_URI}"

            - name: Report existing image
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.image-exists.outputs.exists == 'true'
              run: echo "Image for this commit already exists; skipping push."
