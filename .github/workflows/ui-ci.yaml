name: UI CI

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - "ui/**"
            - ".github/workflows/ui-ci.yaml"
    push:
        branches: [main]
        paths:
            - "ui/**"
            - ".github/workflows/ui-ci.yaml"

permissions:
    contents: read

concurrency:
    group: ui-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test and package UI
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        defaults:
            run:
                working-directory: ui

        steps:
            - name: Check out source
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Java 21
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: maven
                  cache-dependency-path: ui/pom.xml

            - name: Build and test
              run: ./mvnw --batch-mode --no-transfer-progress verify

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build container image
              uses: docker/build-push-action@v7
              with:
                  context: ./ui
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: check list of docker images
              run: docker images
